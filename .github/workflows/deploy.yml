name: vidalotvdt.fr

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      # Typecheck needs the generated Prisma types; generate never connects, but the config requires the var.
      - run: npx prisma generate && npm run typecheck
        env:
          DATABASE_URL: file:/tmp/ci.db
      # Fails on known high/critical vulnerabilities in production dependencies.
      - run: npm audit --omit=dev --audit-level=high

  # Build + deploy only if lint passed, and never for PRs.
  docker:
    needs: lint
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/resacworld/vidalotvdt.fr
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Coolify pulls :latest and restarts the app.
      # COOLIFY_WEBHOOK: resource > Webhooks > "Deploy Webhook" URL. COOLIFY_TOKEN: Keys & Tokens > API tokens (deploy permission).
      - name: Deploy on Coolify
        run: |
          curl --fail-with-body -sS -X POST "$COOLIFY_WEBHOOK" -H "Authorization: Bearer $COOLIFY_TOKEN"
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
